[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sahajmails"
dynamic = ["version"]
description = "Simple, secure bulk email — a local tool and Python library with optional AI personalization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sahaj Raj Malla", email = "mallasahajraj@gmail.com" }]
keywords = [
    "email",
    "bulk-email",
    "email-marketing",
    "smtp",
    "gmail",
    "personalization",
    "mail-merge",
    "ai",
    "fastapi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "click>=8.1",
    "openpyxl>=3.1",
    "markdown>=3.5",
    "dnspython>=2.6",
]

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[project.scripts]
sahajmails = "sahajmails.cli:main"

[project.urls]
Homepage = "https://github.com/sahajrajmalla/sahajmails"
Repository = "https://github.com/sahajrajmalla/sahajmails"
Documentation = "https://github.com/sahajrajmalla/sahajmails/blob/main/docs/getting-started.md"
Changelog = "https://github.com/sahajrajmalla/sahajmails/blob/main/CHANGELOG.md"
Issues = "https://github.com/sahajrajmalla/sahajmails/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.0",
    "pre-commit>=3.7",
]

# ---------------------------------------------------------------- packaging --

[tool.setuptools.dynamic]
version = { attr = "sahajmails.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sahajmails*"]

[tool.setuptools.package-data]
sahajmails = ["py.typed", "server/static/**/*", "assets/**/*"]

# ------------------------------------------------------------------- ruff --

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sahajmails", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
]
ignore = [
    "S101",  # assert is fine in tests
    "E501",  # line length is handled by the formatter
]
# TID is deliberately not enabled: its default bans relative imports from parent
# modules, which is exactly how the intra-package imports here are written.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]  # test credentials and tmp paths

[tool.ruff.lint.isort]
known-first-party = ["sahajmails"]


# ------------------------------------------------------------------- mypy --

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
files = ["sahajmails", "tests"]

[[tool.mypy.overrides]]
module = ["markdown.*", "openpyxl.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------- pytest --

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sahajmails"]
branch = true
omit = ["sahajmails/server/static/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
