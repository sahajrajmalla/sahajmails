name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy

  test:
    name: Test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One job each on the other platforms. macOS and Windows differ in
          # path handling and process spawning, which the CLI touches.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=40

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Assert the wheel is clean and ships the UI
        run: |
          python - <<'PY'
          import sys, zipfile, pathlib
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()

          top = {n.split("/")[0] for n in names if not n.endswith(".dist-info/")}
          top = {t for t in top if not t.endswith(".dist-info")}
          assert top == {"sahajmails"}, f"wheel leaks top-level dirs: {sorted(top)}"

          assert any(n.startswith("sahajmails/server/static/") for n in names), \
              "web UI missing from wheel"
          assert "sahajmails/py.typed" in names, "py.typed missing from wheel"
          print(f"{wheel.name}: OK")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
